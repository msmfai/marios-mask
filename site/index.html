<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17120e">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; worker-src 'self'; img-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="description" content="Build Mario's Mask locally in your browser.">
    <title>Mario's Mask</title>
    <link rel="stylesheet" href="styles.css">
    <script src="patcher.js" type="module"></script>
  </head>
  <body>
    <main>
      <img
        class="hero-image"
        src="https://github.com/msmfai/marios-mask/releases/download/v0.8.0/hero.png"
        alt="Mario standing in Termina"
      >
      <h1>Mario's Mask</h1>

      <section class="patcher" aria-label="Mario's Mask patcher options">
        <p class="rom-requirements">
          <strong>Use NTSC Nintendo 64 ROMs for all three games.</strong>
          Ocarina of Time may be revision 1.0, 1.1, or 1.2.
        </p>
        <div class="rom-inputs">
          <label class="rom-input" for="sm64-rom">
            <span class="rom-number" aria-hidden="true">1</span>
            <span>
              <strong>Super Mario 64</strong>
              <small>NTSC-USA ROM</small>
              <span id="sm64-name" class="file-name">Select local ROM</span>
            </span>
            <input id="sm64-rom" type="file" accept=".z64,.v64,.n64,.rom,.zip,.gz">
          </label>
          <label class="rom-input" for="oot-rom">
            <span class="rom-number" aria-hidden="true">2</span>
            <span>
              <strong>Ocarina of Time</strong>
              <small>NTSC ROM — revision 1.0, 1.1, or 1.2</small>
              <span id="oot-name" class="file-name">Select local ROM</span>
            </span>
            <input id="oot-rom" type="file" accept=".z64,.v64,.n64,.rom,.zip,.gz">
          </label>
          <label class="rom-input" for="mm-rom">
            <span class="rom-number" aria-hidden="true">3</span>
            <span>
              <strong>Majora's Mask</strong>
              <small>NTSC-USA ROM</small>
              <span id="mm-name" class="file-name">Select local ROM</span>
            </span>
            <input id="mm-rom" type="file" accept=".z64,.v64,.n64,.rom,.zip,.gz">
          </label>
        </div>

        <fieldset class="mario-colour">
          <legend>Mario's clothes</legend>
          <div class="colour-options">
            <label class="colour-option">
              <input type="radio" name="mario-colour" value="green" checked>
              <span class="colour-swatch green-swatch" aria-hidden="true"></span>
              <span><strong>L(ink) Is Real</strong><small>Canonical green Mario</small></span>
            </label>
            <label class="colour-option">
              <input type="radio" name="mario-colour" value="red">
              <span class="colour-swatch red-swatch" aria-hidden="true"></span>
              <span><strong>Original</strong><small>Classic red Mario</small></span>
            </label>
            <label class="colour-option">
              <input type="radio" name="mario-colour" value="custom">
              <input id="custom-colour" type="color" value="#185816" aria-label="Custom Mario colour">
              <span><strong>Custom</strong><small>Choose any colour</small></span>
            </label>
          </div>
          <small class="colour-note">
            Mario canonically wears green and NPCs may refer to his green clothes.
          </small>
        </fieldset>

        <div class="build-actions">
          <button id="build-rom" class="build-button" type="button" disabled>
            Build Mario's Mask
          </button>
          <a id="download-rom" class="download-button" href="#" hidden>Download patched ROM</a>
          <p id="patcher-status" class="patcher-status" role="status" aria-live="polite">
            Loading patcher…
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
