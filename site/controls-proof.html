<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17120e">
    <meta name="description" content="Editable Mario's Mask controller diagram proof.">
    <title>Mario's Mask — Controls proof</title>
    <link rel="stylesheet" href="controls-proof.css">
    <script src="controls-proof.js" type="module"></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Controls proof</h1>
          <p>Drag each numbered label. Positions are saved in this browser.</p>
        </div>
        <div class="proof-actions">
          <button id="reset-labels" type="button">Reset</button>
          <button id="copy-labels" type="button">Copy positions</button>
        </div>
      </header>

      <div class="proof-layouts">
        <section>
          <h2>Player 1</h2>
          <div class="proof-controller" data-controller="player1">
            <img src="n64-controller.svg" alt="Nintendo 64 controller">
            <button class="drag-label" data-label="1" type="button"><b>1</b><span>Move</span></button>
            <button class="drag-label" data-label="2" type="button"><b>2</b><span>D-pad camera</span></button>
            <button class="drag-label" data-label="3" type="button"><b>3</b><span>C-Up: Enhanced Mode</span></button>
            <button class="drag-label" data-label="10" type="button"><b>10</b><span>C-Left / Down / Right: Items</span></button>
            <button class="drag-label" data-label="4" type="button"><b>4</b><span>Jump</span></button>
            <button class="drag-label" data-label="5" type="button"><b>5</b><span>Attack / carry / throw</span></button>
            <button class="drag-label" data-label="6" type="button"><b>6</b><span>Pause</span></button>
            <button class="drag-label" data-label="7" type="button"><b>7</b><span>Crouch / ground-pound</span></button>
            <button class="drag-label" data-label="8" type="button"><b>8</b><span>R: Z-target</span></button>
          </div>
        </section>

        <section>
          <h2>Player 2</h2>
          <div class="proof-controller" data-controller="player2">
            <img src="n64-controller.svg" alt="Nintendo 64 controller">
            <button class="drag-label" data-label="9" type="button"><b>9</b><span>Alt camera</span></button>
          </div>
        </section>
      </div>
      <p id="proof-status" class="proof-status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
