name: release-audit

on:
  push:
  pull_request:

jobs:
  android-release-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install pinned Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Android JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs \
            build --release --manifest-path patcher/Cargo.toml --locked \
            --no-default-features --features android-jni
      - name: Build and audit debug-signed APK
        run: |
          gradle -p android --no-daemon :app:assembleDebug
          python3 packaging/audit_android_package.py android/app/build/outputs/apk/debug/app-debug.apk
          apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk

  standalone-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI link libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev
      - name: Reject ROMs and extracted media in tree or history
        run: python3 tools/release_audit.py --tree .
      - name: Check coupled release pins
        run: python3 tools/check_release_contract.py
      - name: Check undeployed project splash page
        run: python3 tools/check_project_site.py
      - name: Test and size-check the standalone patcher
        run: |
          cargo test --manifest-path patcher/Cargo.toml --locked
          cargo build --release --manifest-path patcher/Cargo.toml --locked
          test "$(wc -c < patcher/target/release/marios-mask-builder)" -le 16777216
