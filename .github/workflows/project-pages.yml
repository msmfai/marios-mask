name: project-pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/project-pages.yml
      - patcher/**
      - site/**
      - tools/check_project_site.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned WebAssembly bindings tool
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked
      - name: Test patcher core
        run: cargo test --manifest-path patcher/Cargo.toml --lib --no-default-features
      - name: Build browser patcher
        run: |
          cargo build --manifest-path patcher/Cargo.toml --target wasm32-unknown-unknown --release --no-default-features --features web
          wasm-bindgen patcher/target/wasm32-unknown-unknown/release/marios_mask_builder.wasm --target web --out-dir site/pkg --no-typescript
      - name: Validate project site
        run: python3 tools/check_project_site.py --require-built-patcher
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
