name: Report a problem
description: Tell us what went wrong while building or playing Mario's Mask.
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: mod_version
    attributes:
      label: Mario's Mask version
      placeholder: "e.g. Beta 0.4.0"
    validations:
      required: true
  - type: dropdown
    id: game_mode
    attributes:
      label: Game mode
      options:
        - Standard
        - Classic
        - Built before Beta 0.4.0
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: emulator
    attributes:
      label: What are you playing on?
      options:
        - RetroArch (Mupen64Plus-Next core)
        - RetroArch (ParaLLEl N64 core)
        - ares
        - Gopher64
        - simple64
        - Project64
        - Mupen64Plus (standalone)
        - Real N64 (EverDrive or other flashcart)
        - Other
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Where you were, what you did, and what went wrong. Screenshots, video and save files help.
    validations:
      required: true
