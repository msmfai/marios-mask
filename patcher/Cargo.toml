[package]
name = "marios-mask-builder"
version = "0.11.2"
edition = "2021"
license = "GPL-3.0-only"
description = "Standalone three-ROM builder for Mario's Mask"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]
android-jni = ["dep:jni"]
recipe-tool = []

[dependencies]
anyhow = "1.0"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"], optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
rfd = { version = "0.15.4", default-features = false, features = ["async-std", "xdg-portal"], optional = true }
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", optional = true }

[[bin]]
name = "marios-mask-builder"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "marios-mask-recipe"
path = "src/bin/recipe_tool.rs"
required-features = ["recipe-tool"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"
